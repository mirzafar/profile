<!DOCTYPE html>
<html lang="{{ 'kk' if lang == 'kz' else 'ru' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ t("brand") }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<style>
  :root{
    --bg:#F4F2EC;--bg-2:#ECE8DF;--ink:#17211F;--ink-soft:#3A423F;--muted:#827D73;
    --line:#E3DED3;--line-strong:#D2CBBD;--accent:#1C9C97;--accent-deep:#14756F;
    --accent-soft:#E6F3F1;--paper:#FCFBF7;--radius:18px;--radius-sm:12px;--radius-pill:999px;
    --shadow-sm:0 8px 24px -14px rgba(20,35,33,.30);--shadow:0 30px 64px -34px rgba(20,35,33,.34);
    --ease:cubic-bezier(.16,.84,.44,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  h1,h2,h3,h4{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;line-height:1.1}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}
  header.nav{position:sticky;top:0;z-index:50;background:rgba(244,242,236,.85);backdrop-filter:saturate(1.3) blur(14px);border-bottom:1px solid var(--line)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Cormorant Garamond',serif;font-size:19px}
  .brand .dot{width:7px;height:7px;border:1px solid var(--accent);transform:rotate(45deg)}
  .nav-right{display:flex;align-items:center;gap:16px;flex-wrap:nowrap;white-space:nowrap}
  .nav-right a{font-size:13.5px;color:var(--ink-soft);transition:color .3s}
  .nav-right a:hover{color:var(--accent)}
  .lang{display:inline-flex;gap:2px;border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:3px}
  .lang a{font-size:11.5px;font-weight:600;letter-spacing:.06em;padding:5px 11px;border-radius:var(--radius-pill);color:var(--muted)}
  .lang a.active{background:var(--accent);color:#fff}
  .logout{background:none;border:none;font:inherit;font-size:13.5px;color:var(--ink-soft);cursor:pointer;padding:0}
  .logout:hover{color:var(--accent)}
  .nav-right a.nav-btn{font-size:13px;padding:8px 18px;border-radius:var(--radius-pill);border:1px solid var(--accent);color:var(--accent-deep);transition:background .3s,color .3s}
  .nav-right a.nav-btn:hover{background:var(--accent);color:#fff}
  .nav-right a.nav-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .nav-right a.nav-btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
  main{padding:48px 0 90px}
  .auth-wrap{min-height:calc(100vh - 220px);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .auth-card{width:100%;max-width:440px}
  .auth-card .page-head{text-align:center;margin-bottom:24px}
  .btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px;border:1px solid var(--line-strong);border-radius:var(--radius-pill);background:#fff;color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;transition:border-color .3s,box-shadow .3s}
  .btn-google:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .btn-google svg{width:18px;height:18px;flex:0 0 auto}
  .divider{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:22px 0}
  .divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
  .note-center{text-align:center;color:var(--muted);font-size:14px;margin-top:18px;line-height:1.6}
  .page-head{margin-bottom:32px}
  .page-head h1{font-size:clamp(30px,5vw,46px)}
  .page-head .sub{color:var(--muted);margin-top:8px;font-size:15px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow-sm)}
  .card + .card{margin-top:20px}
  label{display:block;font-size:12.5px;letter-spacing:.04em;color:var(--muted);margin:16px 0 6px;text-transform:uppercase}
  input[type=text],input[type=email],input[type=password],input[type=tel],select,textarea{
    width:100%;padding:13px 15px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);
    background:#fff;font:inherit;color:var(--ink);transition:border-color .3s,box-shadow .3s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{min-height:96px;resize:vertical}
  .btn{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
    padding:14px 26px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:var(--radius-pill);cursor:pointer;transition:all .35s var(--ease)}
  .btn:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
  .btn-sm{padding:9px 16px;font-size:11.5px}
  .btn-ghost{background:transparent;color:var(--accent-deep)}
  .btn-ghost:hover{background:var(--accent);color:#fff}
  .msg{padding:13px 16px;border-radius:var(--radius-sm);font-size:14px;margin-bottom:20px}
  .msg.err{background:#FBEDEA;color:#9B3B2B;border:1px solid #F0D2CB}
  .msg.ok{background:var(--accent-soft);color:var(--accent-deep);border:1px solid #CDE8E5}
  .muted{color:var(--muted)}
  .alt-link{margin-top:18px;font-size:14px;color:var(--muted)}
  .alt-link a{color:var(--accent-deep);font-weight:500}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .tag{display:inline-block;font-size:11px;letter-spacing:.04em;padding:4px 10px;border-radius:var(--radius-pill);white-space:nowrap}
  .st-new{background:var(--accent-soft);color:var(--accent-deep)}
  .st-in_progress{background:#FBF1D8;color:#8A6D1E}
  .st-done{background:#E4EFE6;color:#3C7A4A}
  .st-rejected{background:#F1E6E4;color:#8A4436}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-sm)}
  .stat .v{font-family:'Cormorant Garamond',serif;font-size:46px;color:var(--ink);line-height:1}
  .stat .l{font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:8px}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  .filters select,.filters input{width:auto}
  .note{background:var(--bg-2);border-radius:var(--radius-sm);padding:10px 13px;font-size:13.5px;margin-top:8px}
  .note .meta{font-size:11px;color:var(--muted);margin-bottom:3px}
  .inline-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pager{display:flex;gap:6px;margin-top:24px;flex-wrap:wrap}
  .pager a,.pager span{padding:7px 13px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);font-size:13px}
  .pager .cur{background:var(--accent);color:#fff;border-color:var(--accent)}
  .table-scroll{overflow-x:auto}
  .nav-links{display:flex;align-items:center;gap:18px}
  .burger{display:none;flex-direction:column;gap:5px;width:28px;height:22px;justify-content:center;background:none;border:none;cursor:pointer;padding:0}
  .burger span{height:2px;width:100%;background:var(--ink);border-radius:2px;transition:.35s var(--ease)}
  header.nav.open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  header.nav.open .burger span:nth-child(2){opacity:0}
  header.nav.open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  @media(max-width:640px){
    .nav-inner{height:60px}
    .burger{display:flex}
    .nav-links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;
      background:var(--bg);border-bottom:1px solid var(--line);padding:8px 22px 16px;box-shadow:var(--shadow-sm)}
    header.nav.open .nav-links{display:flex}
    .nav-links a,.nav-links form{border-bottom:1px solid var(--line);padding:13px 0;font-size:15px}
    .nav-links .logout{padding:0;font-size:15px}
    .nav-links a.nav-btn,.nav-links a.nav-btn.primary{border:none;border-bottom:1px solid var(--line);border-radius:0;background:none;color:var(--ink);text-align:left;padding:13px 0}
  }
</style>
</head>
<body>
<header class="nav">
  <div class="wrap nav-inner">
    <a href="/" class="brand"><span class="dot"></span>{{ t("brand") }}</a>
    <div class="nav-right">
      <nav class="nav-links" id="navLinks">
        <a href="/">{{ t("home") }}</a>
        {% if current_user %}
          {% if current_user["role"] == "admin" %}
            <a href="/admin">{{ t("admin") }}</a>
          {% end %}
          <a href="/cabinet">{{ t("cabinet") }}</a>
          <form action="/logout" method="post" style="display:inline">
            {% module xsrf_form_html() %}
            <button class="logout" type="submit">{{ t("logout") }}</button>
          </form>
        {% else %}
          <a href="/login" class="nav-btn">{{ t("login") }}</a>
          <a href="/register" class="nav-btn primary">{{ t("register") }}</a>
        {% end %}
      </nav>
      <span class="lang">
        <a href="/setlang?lang=kz&next={{ url_escape(next_uri) }}" class="{{ 'active' if lang == 'kz' else '' }}">KZ</a>
        <a href="/setlang?lang=ru&next={{ url_escape(next_uri) }}" class="{{ 'active' if lang == 'ru' else '' }}">RU</a>
      </span>
      <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>
<main>
  <div class="wrap">
    {% block content %}{% end %}
  </div>
</main>
<script>
  (function(){
    var nav=document.querySelector('header.nav');
    var burger=document.getElementById('burger');
    if(burger&&nav){
      burger.addEventListener('click',function(){nav.classList.toggle('open');});
      document.querySelectorAll('#navLinks a').forEach(function(a){
        a.addEventListener('click',function(){nav.classList.remove('open');});
      });
    }
  })();
</script>
</body>
</html>
